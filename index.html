<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBoxen - Agent Guide System v11.28</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f3f4f6; color: #1f2937; }
        
        .container { display: flex; flex-direction: column; height: 100vh; }
        
        .header { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); color: white; padding: 12px 20px; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .nav-tabs { display: flex; gap: 8px; }
        .nav-tab-btn { background: rgba(255, 255, 255, 0.15); color: white; border: 1px solid rgba(255, 255, 255, 0.3); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
        .nav-tab-btn:hover { background: rgba(255, 255, 255, 0.25); }
        .nav-tab-btn.active { background: white; color: #1e3a8a; border-color: white; }

        .main-body { display: flex; flex: 1; overflow: hidden; }
        
        .left-panel { width: 300px; background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; padding: 16px; flex-shrink: 0; }
        .right-panel { flex: 1; overflow-y: auto; padding: 24px; display: block; }
        
        .section { margin-bottom: 20px; }
        .section-title { font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .btn { padding: 8px 10px; border: 1px solid #e5e7eb; background: white; border-radius: 6px; cursor: pointer; font-size: 11px; transition: all 0.2s; width: 100%; text-align: left; margin-bottom: 6px; color: #374151; font-weight: 500; }
        .btn:hover { border-color: #3b82f6; background: #f0f9ff; }
        
        .search-container { position: relative; margin-bottom: 12px; display: flex; align-items: center; }
        .sidebar-search-field { width: 100%; padding: 8px 30px 8px 10px; border: 2px solid #3b82f6; border-radius: 6px; font-size: 12px; outline: none; }
        .search-clear-btn { position: absolute; right: 6px; background: #e5e7eb; border: none; color: #4b5563; font-size: 10px; font-weight: bold; cursor: pointer; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; }

        .gate-buttons { display: flex; flex-direction: column; gap: 8px; }
        .gate-btn { padding: 12px 16px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; text-align: left; }
        .gate-btn:hover { opacity: 0.9; }

        .template-box { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 16px; margin-top: 12px; border-radius: 4px; }
        .template-title { font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .template-text { font-size: 13px; line-height: 1.6; margin-bottom: 12px; white-space: pre-wrap; word-break: break-word; }
        
        .copy-btn { background: #3b82f6; color: white; padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .back-btn { background: #6b7280; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 16px; width: 100%; }

        .divider { height: 1px; background: #e5e7eb; margin: 16px 0; }
        .category-badge { display: inline-block; padding: 2px 8px; background: #e0e7ff; color: #3730a3; border-radius: 12px; font-size: 10px; font-weight: 700; margin-bottom: 6px; }
        .filter-chip { display: inline-block; padding: 4px 8px; background: #e5e7eb; color: #4b5563; border-radius: 12px; font-size: 10px; font-weight: 600; cursor: pointer; margin-right: 4px; margin-bottom: 6px; }
        .filter-chip.active { background: #3b82f6; color: white; }

        .admin-form { background: white; padding: 24px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #374151; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
        
        .admin-subnav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; flex-wrap: wrap; }
        .admin-subtab-btn { padding: 8px 16px; border: none; background: #e5e7eb; color: #374151; font-weight: 600; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .admin-subtab-btn.active { background: #1e3a8a; color: white; }

        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e5e7eb; font-size: 12px; margin-top: 16px; }
        .admin-table th, .admin-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .admin-table th { background: #f9fafb; font-weight: 700; color: #4b5563; }
        .admin-table tr:hover { background: #f0f9ff; }
        .action-btn { padding: 6px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; margin-right: 4px; color: white; }
        .edit-btn { background: #f59e0b; }
        .delete-btn { background: #ef4444; }
        .activate-btn { background: #2563eb; }

        .quiz-card { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
        .quiz-opt-btn { width: 100%; padding: 8px; margin-top: 6px; background: white; border: 1px solid #86efac; border-radius: 4px; text-align: left; font-size: 12px; font-weight: 600; cursor: pointer; }
        .quiz-opt-btn:hover { background: #dcfce7; }

        .chapter-box { background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        .chapter-title { font-size: 16px; font-weight: 700; color: #1e3a8a; margin-bottom: 10px; }
        .chapter-body { font-size: 13px; line-height: 1.7; color: #374151; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>🤖 iBoxen - Agent Guide System v11.28</div>
            <div class="nav-tabs">
                <button id="tabGuider" class="nav-tab-btn active">🎯 Utbildning & Händelser</button>
                <button id="tabAcademy" class="nav-tab-btn">🎓 iBoxen Academy</button>
                <button id="tabProfile" class="nav-tab-btn">👤 Min Sida</button>
            </div>
        </div>
        
        <div class="main-body">
            <div class="left-panel">
                <div class="section">
                    <div class="section-title">🎯 SYSTEM STATUS</div>
                    <div style="font-size: 11px; color: #6b7280; padding: 10px; background: #f9fafb; border-radius: 4px; border: 1px solid #f3f4f6;">
                        <div id="loginStatusText" style="color: #2563eb; font-weight: 600;">Ej inloggad</div>
                    </div>
                </div>

                <div class="section" id="quizSidebarWidget"></div>

                <div class="divider"></div>

                <div class="section" id="sidebarSearchSection">
                    <div class="section-title">🔍 SÖK MALLAR & AKADEMI</div>
                    <div class="search-container">
                        <input type="text" id="sidebarSearch" class="sidebar-search-field" placeholder="Sök i realtid...">
                        <button id="searchClearBtn" class="search-clear-btn" title="Rensa sökning">✖</button>
                    </div>
                    <div class="section-title" style="margin-top: 12px;">🏷️ KATEGORIER</div>
                    <div id="categoryFilterContainer"></div>
                </div>

                <div class="divider"></div>
                <div class="section">
                    <button class="btn" id="refreshBtn">🔄 Uppdatera från databas</button>
                </div>
            </div>
            
            <div class="right-panel" id="mainContent"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ipbfauhmrotrdnkfwsms.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3Oou_RktT9vs3DWAra3RRA_g8r97WdZ";
        window.sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const FALLBACK_ADMIN = "jasmin.steihle@dynava.com";

        let currentUser = null;
        let isUserAdmin = false;
        let currentMode = 'GUIDER';
        let adminSubTab = 'QUIZ';
        let customMalls = [];
        let createdCategories = [];
        let selectedCategoryFilter = 'ALLA';
        let searchQuery = '';
        let academyChapters = [];
        let allQuizzesList = [];
        let activeQuiz = null;
        let quizAnswersList = [];
        let quizAnswered = false;

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('tabGuider').addEventListener('click', () => switchMode('GUIDER'));
            document.getElementById('tabAcademy').addEventListener('click', () => switchMode('ACADEMY'));
            document.getElementById('tabProfile').addEventListener('click', () => switchMode('PROFILE'));
            document.getElementById('refreshBtn').addEventListener('click', fetchFromDatabase);
            
            const searchInput = document.getElementById('sidebarSearch');
            if (searchInput) searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) clearBtn.addEventListener('click', clearSearch);

            checkUserSession();
            fetchFromDatabase();
            switchMode('GUIDER');
        });

        async function checkUserSession() {
            try {
                const { data } = await window.sbClient.auth.getSession();
                if (data && data.session) {
                    currentUser = data.session.user;
                    await checkAdminStatus();
                    updateLoginStatusUI();
                }
            } catch(e) {}
        }

        async function checkAdminStatus() {
            if (!currentUser) { isUserAdmin = false; return; }
            if (currentUser.email === FALLBACK_ADMIN) { isUserAdmin = true; return; }
            try {
                const { data } = await window.sbClient.from('user_roles').select('is_admin').eq('user_email', currentUser.email).single();
                isUserAdmin = data ? data.is_admin : false;
            } catch(e) {
                isUserAdmin = false;
            }
        }

        function updateLoginStatusUI() {
            const statusText = document.getElementById('loginStatusText');
            if (statusText && currentUser) {
                statusText.innerText = `Inloggad: ${currentUser.email}`;
                statusText.style.color = '#10b981';
            }
            renderQuizWidget();
        }

        async function handleLogin() {
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPass');
            if (!emailInput || !passInput) return;

            const email = emailInput.value.trim();
            const pass = passInput.value.trim();

            const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password: pass });
            if (error) {
                alert("Inloggning misslyckades: " + error.message);
            } else {
                currentUser = data.user;
                await checkAdminStatus();
                try {
                    await window.sbClient.from('user_roles').upsert({ user_email: currentUser.email, is_admin: isUserAdmin });
                } catch(e) {}
                updateLoginStatusUI();
                alert("✅ Inloggad som " + currentUser.email);
                switchMode('PROFILE');
            }
        }

        async function handleLogout() {
            await window.sbClient.auth.signOut();
            currentUser = null;
            isUserAdmin = false;
            document.getElementById('loginStatusText').innerText = "Ej inloggad";
            document.getElementById('loginStatusText').style.color = '#ef4444';
            renderQuizWidget();
            switchMode('PROFILE');
        }

        async function handleResetPassword() {
            const emailInput = document.getElementById('resetEmail');
            if (!emailInput) return;
            const email = emailInput.value.trim();
            if (!email) { alert("Ange din e-postadress."); return; }
            const { error } = await window.sbClient.auth.resetPasswordForEmail(email);
            if (error) alert("Fel: " + error.message);
            else alert("✅ Återställningslänk skickad till din e-post!");
        }

        async function handleUpdatePassword() {
            const passInput = document.getElementById('newPass');
            if (!passInput) return;
            const password = passInput.value.trim();
            if (!password) { alert("Ange ett nytt lösenord."); return; }
            const { error } = await window.sbClient.auth.updateUser({ password });
            if (error) alert("Fel: " + error.message);
            else {
                alert("✅ Lösenordet har uppdaterats!");
                passInput.value = '';
            }
        }

        function toggleAuthForms(showReset) {
            const loginForm = document.getElementById('loginFormContainer');
            const resetForm = document.getElementById('resetFormContainer');
            if (loginForm && resetForm) {
                loginForm.classList.toggle('hidden', showReset);
                resetForm.classList.toggle('hidden', !showReset);
            }
        }

        async function fetchFromDatabase() {
            try {
                const { data: catData } = await window.sbClient.from('categories').select('name');
                if (catData) createdCategories = catData.map(c => c.name.toUpperCase().trim());

                const { data: tmplData } = await window.sbClient.from('templates').select('*').order('created_at', { ascending: true });
                if (tmplData) customMalls = tmplData;

                const { data: chData } = await window.sbClient.from('learning_chapters').select('*').order('sort_order', { ascending: true });
                if (chData) academyChapters = chData;

                const { data: quizData } = await window.sbClient.from('quizzes').select('*').order('created_at', { ascending: false });
                if (quizData && quizData.length > 0) {
                    allQuizzesList = quizData;
                    activeQuiz = quizData.find(q => q.is_active) || quizData[0];
                    if (activeQuiz) {
                        const { data: ansData } = await window.sbClient.from('quiz_answers').select('*').eq('quiz_id', activeQuiz.id);
                        if (ansData) quizAnswersList = ansData;
                    }
                } else {
                    allQuizzesList = [];
                    activeQuiz = null;
                    quizAnswersList = [];
                }

                renderCategoryFilters();
                renderQuizWidget();
                renderView();
            } catch (err) {
                console.error("DB Sync error:", err);
            }
        }

        function renderQuizWidget() {
            const widget = document.getElementById('quizSidebarWidget');
            if (!widget) return;

            if (!currentUser) {
                widget.innerHTML = `
                    <div class="quiz-card">
                        <div style="font-size: 11px; font-weight: 700; color: #166534; margin-bottom: 4px;">📊 DAGENS QUIZ / POLL</div>
                        <div style="font-size: 12px; color: #4b5563;">Logga in på <a href="#" id="gotoProfileLink" style="color: #2563eb; font-weight: 600;">Min Sida</a> för att delta i dagens poll.</div>
                    </div>
                `;
                const link = document.getElementById('gotoProfileLink');
                if (link) link.addEventListener('click', (e) => { e.preventDefault(); switchMode('PROFILE'); });
                return;
            }

            if (!activeQuiz) {
                widget.innerHTML = '';
                return;
            }

            let options = [];
            try {
                options = typeof activeQuiz.options === 'string' ? JSON.parse(activeQuiz.options) : activeQuiz.options;
            } catch(e) { options = []; }

            widget.innerHTML = `
                <div class="quiz-card">
                    <div style="font-size: 11px; font-weight: 700; color: #166534; margin-bottom: 6px;">📊 DAGENS QUIZ / POLL</div>
                    <div style="font-size: 12px; font-weight: 600; color: #111827; margin-bottom: 8px;">${escapeHtml(activeQuiz.question)}</div>
                    ${quizAnswered ? `<div style="font-size: 11px; color: #15803d; font-weight: 700;">✅ Tack för ditt svar!</div>` : 
                        options.map((opt, idx) => `
                            <button class="quiz-opt-btn sidebar-quiz-opt" data-idx="${idx}">${escapeHtml(opt)}</button>
                        `).join('')
                    }
                </div>
            `;

            document.querySelectorAll('.sidebar-quiz-opt').forEach(btn => {
                btn.addEventListener('click', (e) => submitQuizAnswer(activeQuiz.id, parseInt(e.currentTarget.getAttribute('data-idx'))));
            });
        }

        async function submitQuizAnswer(quizId, optionIndex) {
            try {
                await window.sbClient.from('quiz_answers').insert([{ quiz_id: quizId, selected_option: optionIndex }]);
            } catch(e) {}
            quizAnswered = true;
            const { data: ansData } = await window.sbClient.from('quiz_answers').select('*').eq('quiz_id', quizId);
            if (ansData) quizAnswersList = ansData;
            renderQuizWidget();
        }

        function getPopulatedCategories() {
            const activeCategories = customMalls.map(m => m.category ? String(m.category).toUpperCase().trim() : 'ALLMÄNT').filter(cat => cat !== '');
            return ['ALLA', ...new Set([...activeCategories, ...createdCategories])].sort();
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabGuider').className = `nav-tab-btn ${mode === 'GUIDER' ? 'active' : ''}`;
            document.getElementById('tabAcademy').className = `nav-tab-btn ${mode === 'ACADEMY' ? 'active' : ''}`;
            document.getElementById('tabProfile').className = `nav-tab-btn ${mode === 'PROFILE' ? 'active' : ''}`;
            renderView();
        }

        function renderView() {
            renderCategoryFilters();
            const main = document.getElementById('mainContent');

            if (currentMode === 'GUIDER') {
                renderGuiderView(main);
            } else if (currentMode === 'ACADEMY') {
                renderAcademyView(main);
            } else if (currentMode === 'SEARCH') {
                renderSearchView(main);
            } else if (currentMode === 'PROFILE') {
                renderProfileView(main);
            }
        }

        function renderGuiderView(container) {
            container.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto;">
                    <div style="font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #1e3a8a;">🎯 Utbildningsmoduler & Vanliga Händelser</div>
                    <div style="font-size: 12px; color: #6b7280; margin-bottom: 20px;">Välj en händelse för att se hur ärendet ska hanteras steg-för-steg:</div>
                    
                    <div class="gate-buttons">
                        <button class="gate-btn" id="caseBankId">🔑 Case 1: Bank-ID fel / Identifiering misslyckades</button>
                        <button class="gate-btn" id="caseTracking">📍 Case 2: Vart är mitt paket? (Status & Spårning)</button>
                        <button class="gate-btn" id="caseDoor">🔓 Case 3: Luckan öppnas inte / Fel vid skåpet</button>
                        <button class="gate-btn" id="caseNumber">📞 Case 4: Fel telefonnummer på beställningen</button>
                        <button class="gate-btn" id="caseTime">⏱️ Case 5: Kunden hinner inte hämta / Förlängd liggtid</button>
                    </div>
                </div>
            `;
            document.getElementById('caseBankId').addEventListener('click', () => openCaseFlow('bankid'));
            document.getElementById('caseTracking').addEventListener('click', () => openCaseFlow('tracking'));
            document.getElementById('caseDoor').addEventListener('click', () => openCaseFlow('door_issue'));
            document.getElementById('caseNumber').addEventListener('click', () => openCaseFlow('wrong_number'));
            document.getElementById('caseTime').addEventListener('click', () => openCaseFlow('extend_time'));
        }

        function openCaseFlow(caseKey) {
            const main = document.getElementById('mainContent');
            let title = "";
            let text = "";

            if (caseKey === 'bankid') {
                title = "KEY 1: Bank-ID fel";
                text = "Hej! 👋 För att hämta ut paket ur iBoxens skåp med Bank-ID finns ett ålderskrav på 18 år. Om du är under 18 år kan du därför inte verifiera dig själv direkt i appen.\n\nDu kan däremot enkelt låta en person över 18 år hämta ut paketet åt dig. Vill du att jag förklarar hur de gör?";
            } else if (caseKey === 'tracking') {
                title = "CASE 2: Vart är mitt paket?";
                text = "Hej! 👋 Du kan alltid följa ditt pakets status direkt i iBoxen-appen eller via spårningslänken från transportören. Om skåpet är fyllt eller paketet är på väg ombud meddelas du via SMS så fort det är redo!";
            } else if (caseKey === 'door_issue') {
                title = "CASE 3: Luckan öppnas inte";
                text = "Hej! 👋 Om luckan inte öppnar sig när du trycker på 'Öppna lucka' i appen, testa att trycka till luckan lätt utåt samtidigt som du trycker på knappen igen. Om det inte fungerar, kontrollera att Bluetooth är aktiverat i din telefon.";
            } else if (caseKey === 'wrong_number') {
                title = "CASE 4: Fel telefonnummer";
                text = "Hej! 👋 Om du har angett fel telefonnummer vid beställning kan vi tyvärr inte ändra det i efterhand av säkerhetsskäl. Vi rekommenderar att du kontaktar avsändaren (butiken där du handlade) för att uppdatera uppgifterna.";
            } else if (caseKey === 'extend_time') {
                title = "CASE 5: Förlängd liggtid";
                text = "Hej! 👋 Standard liggtid i iBoxen är 3 dagar. Om du behöver mer tid kan du i de flesta fall förlänga liggtiden direkt i iBoxen-appen mot en mindre avgift som styrs av transportören.";
            }

            main.innerHTML = `
                <div style="max-width: 600px; margin: 0 auto;">
                    <span class="category-badge">${title}</span>
                    <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px;">📘 Ärendehantering</div>
                    <div class="template-box" style="margin-bottom: 20px;">
                        <div class="template-title">💬 Agentsvar:</div>
                        <div class="template-text">${escapeHtml(text)}</div>
                        <button class="copy-btn" id="copyTmplBtn">📋 Kopiera till urklipp</button>
                    </div>
                    <button class="back-btn" id="backGuiderBtn">← Tillbaka till översikten</button>
                </div>
            `;
            document.getElementById('copyTmplBtn').addEventListener('click', (e) => copyToClipboard(e.target, text));
            document.getElementById('backGuiderBtn').addEventListener('click', () => switchMode('GUIDER'));
        }

        function renderAcademyView(container) {
            container.innerHTML = `
                <div style="max-width: 800px; margin: 0 auto;">
                    <div style="font-size: 20px; font-weight: 700; color: #1e3a8a; margin-bottom: 16px;">🎓 iBoxen Academy</div>
                    ${academyChapters.length > 0 ? academyChapters.map((ch, idx) => `
                        <div class="chapter-box">
                            <div class="chapter-title">Kapitel ${idx + 1}: ${escapeHtml(ch.title)}</div>
                            <div class="chapter-body">${ch.content}</div>
                        </div>
                    `).join('') : '<div style="color: #6b7280;">Inga kapitel hittades i databasen.</div>'}
                </div>
            `;
        }

        function renderSearchView(container) {
            let filteredMalls = customMalls;
            if (selectedCategoryFilter !== 'ALLA') {
                filteredMalls = filteredMalls.filter(m => String(m.category).toUpperCase().trim() === selectedCategoryFilter);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                filteredMalls = filteredMalls.filter(m => String(m.title).toLowerCase().includes(q) || String(m.text).toLowerCase().includes(q));
            }

            container.innerHTML = `
                <div style="max-width: 650px; margin: 0 auto;">
                    <div style="font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1e3a8a;">🔍 Sökresultat</div>
                    <div class="gate-buttons" id="searchResultsList">
                        ${filteredMalls.map(m => `
                            <button class="gate-btn imported search-item-btn" data-id="${m.id}">
                                <span class="category-badge">${m.category}</span><br>📄 ${m.title}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.search-item-btn').forEach(btn => {
                btn.addEventListener('click', (e) => selectTemplateById(e.currentTarget.getAttribute('data-id')));
            });
        }

        async function renderProfileView(container) {
            if (!currentUser) {
                container.innerHTML = `
                    <div style="max-width: 450px; margin: 40px auto;">
                        <div class="admin-form" id="loginFormContainer">

        async function addNewAdminUser() {
            const emailInput = document.getElementById('newAdminEmail');
            const roleSelect = document.getElementById('newUserRoleSelect');
            if (!emailInput || !roleSelect) return;

            const email = emailInput.value.trim().toLowerCase();
            const isAdmin = roleSelect.value === 'true';

            if (!email || !email.includes('@')) {
                alert("Ange en giltig e-postadress.");
                return;
            }

            const tempPassword = "iBoxenTempPassword123!";

            // 1. Skapa kontot i Supabase Auth automatiskt
            const { error: authError } = await window.sbClient.auth.signUp({
                email: email,
                password: tempPassword
            });

            if (authError) {
                console.log("Auth info (kan bero på att kontot redan finns):", authError.message);
            }

            // 2. Spara vald roll i behörighetstabellen
            const { error: roleError } = await window.sbClient.from('user_roles').upsert({ user_email: email, is_admin: isAdmin });
            if (roleError) {
                alert("Kunde inte spara behörighet: " + roleError.message);
            } else {
                alert(`✅ Konto skapat för ${email} som ${isAdmin ? 'ADMINISTRATÖR' : 'VANLIG ANVÄNDARE'}!\n\nTillfälligt lösenord: ${tempPassword}\n(Be dem byta lösenord på Min Sida eller använda "Glömt lösenord").`);
                document.getElementById('newAdminEmail').value = '';
                renderAdminSubContent();
            }
        }

        async function toggleUserAdmin(email, newStatus) {
            const { error } = await window.sbClient.from('user_roles').upsert({ user_email: email, is_admin: newStatus });
            if (error) {
                alert("Kunde inte uppdatera behörighet: " + error.message);
            } else {
                alert("✅ Behörighet uppdaterad för " + email);
                renderAdminSubContent();
            }
        }

        async function removeUserRole(email) {
            if (!confirm(`Är du säker på att du vill ta bort ${email} helt från behörighetslistan?`)) return;
            const { error } = await window.sbClient.from('user_roles').delete().eq('user_email', email);
            if (error) {
                alert("Kunde inte radera: " + error.message);
            } else {
                alert("🗑️ Borttagen!");
                renderAdminSubContent();
            }
        }

            const q = document.getElementById('newQuizQuestion').value.trim();

            const optsArr = rawOpts.split(',').map(o => o.trim());
            
            await window.sbClient.from('quizzes').update({ is_active: false }).neq('id', '0');
            await window.sbClient.from('quizzes').insert([{ id: 'quiz_' + Date.now(), question: q, options: optsArr, is_active: true }]);
            alert("🚀 Quiz publicerat i sidomenyn!");
            await fetchFromDatabase();
            renderAdminSubContent();
        }

            await window.sbClient.from('quizzes').update({ is_active: false }).neq('id', '0');
            await window.sbClient.from('quizzes').update({ is_active: true }).eq('id', id);
            await fetchFromDatabase();
            renderAdminSubContent();
        }

            await window.sbClient.from('quizzes').delete().eq('id', id);

            const content = document.getElementById('newChapterContent').value.trim();
            if (!title || !content) return;
            await window.sbClient.from('learning_chapters').insert([{ id: 'ch_' + Date.now(), title, content, sort_order: academyChapters.length + 1 }]);
            alert("✅ Kapitel sparat!");
            fetchFromDatabase();
        }

        async function saveAdminTemplate() {
            const cat = document.getElementById('adminKategoriText').value.toUpperCase().trim();
            const title = document.getElementById('adminTitle').value.trim();
            const text = document.getElementById('adminText').value.trim();
            if (!title || !text || !cat) return;
            await window.sbClient.from('templates').insert([{ id: 'm_' + Date.now(), category: cat, title, text }]);
            alert("✅ Mall sparad!");
            fetchFromDatabase();
        }

        async function createNewCase() {
            const title = document.getElementById('newCaseTitle').value.trim();
            const category = document.getElementById('newCaseCategory').value.toUpperCase().trim() || 'UTBILDNING';
            const stepTitle = document.getElementById('newCaseStepTitle').value.trim() || 'Start';
            const stepDesc = document.getElementById('newCaseStepDesc').value.trim() || 'Beskrivning';
            const stepTmpl = document.getElementById('newCaseStepTmpl').value.trim();

            if (!title) { alert("Ange en casetitel."); return; }

            const steps = [{ title: stepTitle, desc: stepDesc, template: stepTmpl }];
            const { error } = await window.sbClient.from('flow_cases').insert([{ id: 'case_' + Date.now(), title, category, steps }]);
            if (error) {
                alert("Kunde inte spara case: " + error.message);
            } else {
                alert("✅ Case sparat i databasen!");
                document.getElementById('newCaseTitle').value = '';
                document.getElementById('newCaseCategory').value = '';
                document.getElementById('newCaseStepTitle').value = '';
                document.getElementById('newCaseStepDesc').value = '';
                document.getElementById('newCaseStepTmpl').value = '';
            }
        }

        async function sendAdminMessage() {
            const email = document.getElementById('msgEmail').value.trim();
            const message = document.getElementById('msgContent').value.trim();
            if (!email || !message) return;
            await window.sbClient.from('direct_messages').insert([{ recipient_email: email, message }]);
            alert("✅ Skickat!");
            document.getElementById('msgEmail').value = '';
            document.getElementById('msgContent').value = '';
        }

        function handleSearch(val) {
            searchQuery = val;
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) clearBtn.style.display = val.length > 0 ? 'flex' : 'none';
            currentMode = (val.trim() === '' && selectedCategoryFilter === 'ALLA') ? 'GUIDER' : 'SEARCH';
            renderView();
        }

        function clearSearch() {
            document.getElementById('sidebarSearch').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            searchQuery = '';
            currentMode = selectedCategoryFilter === 'ALLA' ? 'GUIDER' : 'SEARCH';
            renderView();
        }

        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilterContainer');
            if (!container) return;
            container.innerHTML = getPopulatedCategories().map(cat => `
                <span class="filter-chip ${selectedCategoryFilter === cat ? 'active' : ''}" data-cat="${cat}">${cat === 'ALLA' ? 'Alla' : cat}</span>
            `).join('');

            container.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', (e) => setCategoryFilter(e.currentTarget.getAttribute('data-cat')));
            });
        }

        function setCategoryFilter(cat) {
            selectedCategoryFilter = cat;
            currentMode = (cat === 'ALLA' && searchQuery.trim() === '') ? 'GUIDER' : 'SEARCH';
            renderView();
        }

        function selectTemplateById(id) {
            const item = customMalls.find(m => String(m.id) === String(id));
            if (!item) return;
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div style="max-width: 600px; margin: 20px auto;">
                    <span class="category-badge">${item.category}</span>
                    <div style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">${item.title}</div>
                    <div class="template-box">
                        <div class="template-title">💬 Agentsvar</div>
                        <div class="template-text">${escapeHtml(item.text)}</div>
                        <button class="copy-btn" id="copyTmplBtn">📋 Kopiera</button>
                    </div>
                    <button class="back-btn" id="backSearchBtn">← Tillbaka</button>
                </div>
            `;
            document.getElementById('copyTmplBtn').addEventListener('click', (e) => copyToClipboard(e.target, item.text));
            document.getElementById('backSearchBtn').addEventListener('click', () => { currentMode = 'SEARCH'; renderView(); });
        }

        function copyToClipboard(btn, text) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "✅ Kopierat!";
                setTimeout(() => btn.innerText = "📋 Kopiera", 1500);
            });
        }

        function escapeHtml(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
